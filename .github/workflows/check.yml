# Continuous integration. Every push and every pull request runs `make check`,
# which is the same gate a wave must pass on the development machine.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    # The gate builds, vets, style-checks, measures coverage, and fuzzes every
    # target for five seconds. Twenty minutes is well past that, and a run that
    # hangs is stopped rather than holding a runner until the day's limit.
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install bubblewrap and ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: false

      # The version is pinned to the one the development machine runs, because a
      # newer staticcheck reports things the machine's does not and the gate
      # would then pass here and fail there, or the other way round.
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.1

      - name: Run make check
        run: make check
