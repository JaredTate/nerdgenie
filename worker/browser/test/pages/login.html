<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Members area</title>
  </head>
  <body>
    <form id="sign-in" aria-label="Sign in" action="signed-in.html" method="get">
      <h1>Sign in</h1>
      <label for="who">Username</label>
      <input id="who" name="who" type="text" autocomplete="username" />
      <label for="secret">Password</label>
      <input id="secret" name="secret" type="password" autocomplete="current-password" />
      <button type="submit">Continue</button>
    </form>
  </body>
</html>
