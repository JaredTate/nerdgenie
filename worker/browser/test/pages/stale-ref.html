<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Refs that go stale</title>
  </head>
  <body>
    <h1>Refs that go stale</h1>
    <button type="button" id="rebuild">Rebuild the target</button>
    <button type="button" id="change-kind">Change the kind of the target</button>
    <button type="button" id="remove">Remove the target</button>
    <div id="holder">
      <button type="button" class="target">Save the draft</button>
    </div>
    <p id="plain-text-target">The quarterly summary</p>
    <script>
      var holder = document.getElementById("holder");
      // Rebuilding throws away the old element and its ref along with it, but the
      // replacement has the same role and the same name, so the worker should
      // find it again.
      document.getElementById("rebuild").addEventListener("click", function () {
        holder.innerHTML = "";
        var fresh = document.createElement("button");
        fresh.type = "button";
        fresh.className = "target";
        fresh.textContent = "Save the draft";
        holder.appendChild(fresh);
      });
      // Changing the kind keeps the words a person reads but makes it a link
      // instead of a button, so only a search by visible text can find it.
      document.getElementById("change-kind").addEventListener("click", function () {
        holder.innerHTML = "";
        var fresh = document.createElement("a");
        fresh.href = "#saved";
        fresh.textContent = "Save the draft";
        holder.appendChild(fresh);
      });
      // Removing takes it away for good, and no way of finding it can work.
      document.getElementById("remove").addEventListener("click", function () {
        holder.innerHTML = "";
      });
    </script>
  </body>
</html>
